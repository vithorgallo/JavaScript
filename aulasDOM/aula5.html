<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Numeros</title>
</head>
<body>
    <main>
        <h1>Somando Numeros</h1>
        <input type="number" name="txtn1" id="txtn1">
        <p>+</p>
        <input type="number" name="txtn2" id="txtn2">
        <input type="button" value="somar" id="somar" onclick="somar()">
        <div id="res"></div>
    </main>

    <script>
        function somar(){
            var txtn1 = document.querySelector(`input#txtn1`)
            var txtn2 = document.querySelector(`input#txtn2`)
            n1 = Number(txtn1.value)
            n2 = Number(txtn2.value)
            s = n1 + n2  
            res.innerHTML = (`A soma entre os numeros ${n1} e ${n2} é ${s}`)
        }
    </script>
</body>
</html>
